<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配送エリアマップ（新）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  :root{ color-scheme:light dark; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif; }
  #app{ display:flex; height:100%; }
  #sidebar{ width:300px; flex:0 0 300px; background:#0f172a; color:#e2e8f0; padding:16px; overflow-y:auto; }
  #map{ flex:1; }
  h1{ font-size:16px; font-weight:800; margin-bottom:4px; }
  .sub{ font-size:11px; color:#94a3b8; margin-bottom:14px; line-height:1.5; }
  .group{ margin-bottom:16px; }
  .group h2{ font-size:12px; font-weight:700; color:#cbd5e1; margin-bottom:8px; letter-spacing:.03em; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:5px 9px; border-radius:999px;
         background:#1e293b; border:1px solid #334155; cursor:pointer; user-select:none; }
  .chip.on{ background:#1d4ed8; border-color:#3b82f6; color:#fff; }
  .chip .dot{ width:10px; height:10px; border-radius:50%; display:inline-block; }
  select,input[type=text]{ width:100%; padding:8px; border-radius:8px; border:1px solid #334155; background:#1e293b; color:#e2e8f0; font-size:13px; }
  .count{ font-size:12px; color:#94a3b8; margin-top:6px; }
  .foot{ font-size:10px; color:#64748b; margin-top:18px; line-height:1.6; border-top:1px solid #1e293b; padding-top:10px; }
  .marker-dot{ border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.4); }
  .lp b{ font-size:14px; }
  .lp table{ margin-top:6px; font-size:12px; border-collapse:collapse; }
  .lp td{ padding:2px 6px 2px 0; vertical-align:top; }
  .lp td.k{ color:#64748b; white-space:nowrap; }
  #pw-overlay{ position:fixed; inset:0; background:#0f172a; z-index:9999; display:flex; align-items:center; justify-content:center; }
  #pw-overlay .box{ background:#fff; color:#0f172a; border-radius:16px; padding:36px; text-align:center; width:320px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  #pw-overlay input{ width:100%; padding:10px 14px; border:2px solid #e2e8f0; border-radius:8px; font-size:16px; text-align:center; outline:none; margin-bottom:12px; color:#0f172a; background:#fff; }
  #pw-overlay button{ width:100%; border:none; border-radius:8px; padding:10px; font-size:14px; font-weight:700; background:#1d4ed8; color:#fff; cursor:pointer; }
  #loading{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:800; background:#fff; color:#0f172a; padding:14px 20px; border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,.2); font-size:13px; }
  @media(max-width:640px){ #app{ flex-direction:column; } #sidebar{ width:100%; flex:0 0 auto; max-height:42%; } }
</style>
</head>
<body>

<div id="pw-overlay">
  <div class="box">
    <div style="font-size:28px;margin-bottom:8px;">🗺️</div>
    <div style="font-size:18px;font-weight:800;margin-bottom:4px;">配送エリアマップ</div>
    <div style="font-size:12px;color:#718096;margin-bottom:20px;">パスワードを入力してください</div>
    <input type="password" id="pw-input" placeholder="パスワード" onkeypress="if(event.key==='Enter')checkPw()">
    <button onclick="checkPw()">ログイン</button>
    <div id="pw-err" style="color:#dc2626;font-size:12px;margin-top:8px;display:none;">パスワードが正しくありません</div>
  </div>
</div>

<div id="app">
  <div id="sidebar">
    <h1>🗺️ 配送エリアマップ</h1>
    <div class="sub" id="meta">読み込み中…</div>

    <div class="group" id="update-box" style="background:#111c33;border:1px solid #1e3a5f;border-radius:10px;padding:12px;">
      <h2>🔄 CMSデータで更新</h2>
      <div style="font-size:11px;color:#94a3b8;margin-bottom:8px;line-height:1.5;">CMSからDLしたCSVを選び「地図を更新」を押すと、全員の地図に反映されます。</div>
      <input type="file" id="csvfile" accept=".csv,text/csv" style="font-size:12px;color:#cbd5e1;width:100%;">
      <button id="ingestBtn" style="margin-top:8px;width:100%;padding:9px;border:none;border-radius:8px;background:#059669;color:#fff;font-weight:700;cursor:pointer;">この内容で地図を更新</button>
      <div id="ingest-status" style="font-size:11px;color:#cbd5e1;margin-top:8px;line-height:1.6;"></div>
    </div>

    <div class="group">
      <h2>キーワード（企業名・住所）</h2>
      <input type="text" id="kw" placeholder="例：渋谷 / 医療法人…">
    </div>

    <div class="group">
      <h2>配送区分</h2>
      <div class="chips" id="f-kubun"></div>
    </div>

    <div class="group">
      <h2>プラン</h2>
      <div class="chips" id="f-plan"></div>
    </div>

    <div class="group">
      <h2>配達曜日（デリバリー）</h2>
      <div class="chips" id="f-day"></div>
    </div>

    <div class="group">
      <h2>都道府県</h2>
      <select id="f-pref"><option value="">すべて</option></select>
    </div>

    <div class="group">
      <h2>拠点レイヤ（デポ・PC等）</h2>
      <div class="chips" id="f-depot"></div>
      <div style="font-size:10px;color:#64748b;margin-top:6px;">クリックで拠点の位置を重ねて表示</div>
    </div>

    <div class="count" id="count"></div>
    <div class="foot" id="foot"></div>
  </div>
  <div id="map"><div id="loading">データ取得中…</div></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script>
// ===== 設定 =====
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbycvBSQsGtNMCPCHgf29ww6lbTpPbShfhVq_NAIlLr2yDOav7ZJQ-MuiSCW3OMTHw9L/exec';
const PW = 'ody-map';          // ← 変更可（このHTML内の平文簡易ゲート。実際の保護は上記の非公開URL）

// 配送区分ごとの色
const KUBUN_COLORS = {
  'デリバリー'   : '#16a34a', // 緑：配達員対応
  '宅急便'       : '#2563eb', // 青：宅配便
  '宅急便(冷凍)' : '#0891b2', // シアン：宅配便＋冷凍
  '冷凍(宅配)'   : '#7c3aed', // 紫：冷凍
  '未設定'       : '#f59e0b', // 橙
  '解約'         : '#94a3b8'  // グレー
};
const DAYS = ['月','火','水','木','金'];

// ===== パスワードゲート =====
(function(){ if(localStorage.getItem('deliv_map_pw')===PW) unlock(); })();
function checkPw(){
  const v=document.getElementById('pw-input').value;
  if(v===PW){ localStorage.setItem('deliv_map_pw',PW); unlock(); }
  else document.getElementById('pw-err').style.display='block';
}
window.checkPw=checkPw;

let MAP, CLUSTER, ALL=[], ICONS={};
let cxLoaded=false, cxLoading=false, cxCache=[];      // 解約は遅延読込
let DEPOTLAYER=null, DEPOTS=null, depotLoading=false; // デポ/PC等の拠点レイヤ
const state = { kubun:new Set(), plan:new Set(), day:new Set(['月','火','水','木','金','なし']), pref:'', kw:'', depotTypes:new Set() };

// 拠点レイヤ（デポ一覧）の見た目
const DEPOT_STYLE = {
  'デポ':   {c:'#111827', e:'🏠'},
  'SDS':    {c:'#4b5563', e:'🚚'},
  'PC':     {c:'#1d4ed8', e:'🏢'},
  'メーカー':{c:'#92400e', e:'🏭'},
  'サラスタ':{c:'#15803d', e:'🍜'}
};

function unlock(){
  document.getElementById('pw-overlay').style.display='none';
  initMap();
  loadData();
}

function initMap(){
  MAP = L.map('map',{ preferCanvas:true }).setView([37.5,137.0], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19, attribution:'&copy; OpenStreetMap contributors'
  }).addTo(MAP);
  CLUSTER = L.markerClusterGroup({ chunkedLoading:true, spiderfyOnMaxZoom:true, maxClusterRadius:50 });
  MAP.addLayer(CLUSTER);
  DEPOTLAYER = L.layerGroup().addTo(MAP); // 拠点は非クラスタで最前面に
}

function iconFor(kubun){
  if(ICONS[kubun]) return ICONS[kubun];
  const c = KUBUN_COLORS[kubun] || '#f59e0b';
  const ic = L.divIcon({
    className:'', html:`<div class="marker-dot" style="width:14px;height:14px;background:${c};"></div>`,
    iconSize:[14,14], iconAnchor:[7,7], popupAnchor:[0,-7]
  });
  ICONS[kubun]=ic; return ic;
}

async function loadData(){
  try{
    const res = await fetch(BACKEND_URL+'?t='+Date.now(), {redirect:'follow'});
    const d = await res.json();
    cxLoaded=false; cxCache=[]; // 解約は再取得
    ALL = (d.points||[]).filter(p=>typeof p.lat==='number' && typeof p.lng==='number');
    document.getElementById('meta').textContent =
      `データ生成: ${d.generatedAt||'-'} ／ 稼働 ${ (d.stats&&d.stats.active_locations)||ALL.length } 拠点`;
    buildFilters();
    await apply();
    const l=document.getElementById('loading'); if(l) l.remove();
  }catch(e){
    document.getElementById('loading').textContent = '取得エラー: '+e.message;
  }
}

function buildFilters(){
  // 区分（稼働はデータから／「解約」は遅延読込チップとして常設・初期OFF）
  const kubuns=[...new Set(ALL.map(p=>p.kubun))].sort();
  state.kubun = new Set(kubuns);
  chips('f-kubun', [...kubuns, '解約'], state.kubun, KUBUN_COLORS);
  // 拠点レイヤ（デポ/PC等）
  chipsDepot();
  // プラン
  const plans=[...new Set(ALL.flatMap(p=>p.plans||[]))].sort();
  state.plan = new Set(plans);
  chips('f-plan', plans, state.plan, null);
  // 曜日
  chips('f-day', [...DAYS,'なし'], state.day, null);
  // 都道府県
  const prefs=[...new Set(ALL.map(p=>p.pref).filter(Boolean))].sort();
  const sel=document.getElementById('f-pref'); sel.innerHTML='<option value="">すべて</option>';
  prefs.forEach(pf=>{ const o=document.createElement('option'); o.value=pf; o.textContent=pf; sel.appendChild(o); });
  sel.onchange=()=>{ state.pref=sel.value; apply(); };
  document.getElementById('kw').oninput=(e)=>{ state.kw=e.target.value.trim(); apply(); };
}

function chips(containerId, items, set, colors){
  const box=document.getElementById(containerId); box.innerHTML='';
  items.forEach(it=>{
    const el=document.createElement('span');
    el.className='chip'+(set.has(it)?' on':'');
    const dot = colors ? `<span class="dot" style="background:${colors[it]||'#94a3b8'}"></span>`:'';
    el.innerHTML = dot + `<span>${it}</span>`;
    el.onclick=()=>{ set.has(it)?set.delete(it):set.add(it); el.classList.toggle('on'); apply(); };
    box.appendChild(el);
  });
}

function match(p){
  if(!state.kubun.has(p.kubun)) return false;
  if(state.pref && p.pref!==state.pref) return false;
  // プラン：点のプランのいずれかが選択されていればOK。プラン情報なしは常に表示。
  if((p.plans||[]).length){
    if(!p.plans.some(pl=>state.plan.has(pl))) return false;
  }
  // 曜日：デリバリーで曜日ありなら選択曜日と交差、曜日なしは「なし」がONなら表示
  const days=p.days||[];
  if(days.length){ if(!days.some(d=>state.day.has(d))) return false; }
  else{ if(!state.day.has('なし')) return false; }
  if(state.kw){
    const s=(p.name+' '+p.addr).toLowerCase();
    if(s.indexOf(state.kw.toLowerCase())<0) return false;
  }
  return true;
}

async function apply(){
  if(state.kubun.has('解約') && !cxLoaded){ await loadCx(); }
  const shown = ALL.filter(match);
  CLUSTER.clearLayers();
  const markers = shown.map(p=>{
    const m=L.marker([p.lat,p.lng],{icon:iconFor(p.kubun)});
    m.bindPopup(popupHtml(p),{maxWidth:320});
    return m;
  });
  CLUSTER.addLayers(markers);
  document.getElementById('count').textContent = `表示中: ${shown.length.toLocaleString()} 拠点`;
}

// 解約データは初回ONで取得（軽量化）
async function loadCx(){
  if(cxLoaded || cxLoading) return;
  cxLoading=true;
  const cnt=document.getElementById('count'); if(cnt) cnt.textContent='解約データ取得中…';
  try{
    const r=await fetch(BACKEND_URL+'?set=cx&t='+Date.now(),{redirect:'follow'});
    const d=await r.json();
    cxCache=(d.points||[]).filter(p=>typeof p.lat==='number'&&typeof p.lng==='number');
    ALL=ALL.concat(cxCache); cxLoaded=true;
  }catch(e){}
  cxLoading=false;
}

// ===== 拠点レイヤ（デポ/PC等）=====
function chipsDepot(){
  const box=document.getElementById('f-depot'); box.innerHTML='';
  Object.keys(DEPOT_STYLE).forEach(t=>{
    const el=document.createElement('span'); el.className='chip'+(state.depotTypes.has(t)?' on':'');
    el.innerHTML=`<span class="dot" style="background:${DEPOT_STYLE[t].c}"></span><span>${DEPOT_STYLE[t].e} ${t}</span>`;
    el.onclick=async()=>{ state.depotTypes.has(t)?state.depotTypes.delete(t):state.depotTypes.add(t); el.classList.toggle('on'); await ensureDepots(); renderDepots(); };
    box.appendChild(el);
  });
}
async function ensureDepots(){
  if(DEPOTS || depotLoading || !state.depotTypes.size) return;
  depotLoading=true;
  try{ const r=await fetch(BACKEND_URL+'?set=depot&t='+Date.now(),{redirect:'follow'}); const d=await r.json(); DEPOTS=d.points||[]; }
  catch(e){ DEPOTS=[]; }
  depotLoading=false;
}
function renderDepots(){
  DEPOTLAYER.clearLayers();
  if(!DEPOTS) return;
  DEPOTS.filter(p=>state.depotTypes.has(p.type)).forEach(p=>{
    const st=DEPOT_STYLE[p.type]||{c:'#000',e:'📍'};
    const ic=L.divIcon({className:'',html:`<div style="font-size:20px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))">${st.e}</div>`,iconSize:[24,24],iconAnchor:[12,12],popupAnchor:[0,-12]});
    L.marker([p.lat,p.lng],{icon:ic,zIndexOffset:1000})
      .bindPopup(`<div class="lp"><b>${esc(p.name)}</b><table><tr><td class="k">種別</td><td>${esc(p.type)}</td></tr><tr><td class="k">住所</td><td>${esc(p.addr)}</td></tr></table></div>`)
      .addTo(DEPOTLAYER);
  });
}

function popupHtml(p){
  const row=(k,v)=> v?`<tr><td class="k">${k}</td><td>${esc(v)}</td></tr>`:'';
  return `<div class="lp"><b>${esc(p.name||'(名称なし)')}</b>${p.floor?' <span style="color:#64748b">'+esc(p.floor)+'</span>':''}
    <table>
      ${row('住所',p.addr)}
      ${row('配送区分',p.kubun)}
      ${row('デポ/委託先',p.depot)}
      ${row('PC',p.pc)}
      ${row('プラン',(p.plans||[]).join('・'))}
      ${row('配達曜日',(p.days||[]).join('・'))}
      ${row('個数',p.count)}
      ${row('ステータス',p.status)}
    </table></div>`;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ===== CMSデータで更新（アプリ内アップロード）=====
const HCOL = {company:'企業',floor:'フロア',pc:'ピッキングセンター',depot:'デポ',pref:'都道府県',address:'住所',plan:'プラン',count:'個数',status:'稼働ステータス',mon:'月',tue:'火',wed:'水',thu:'木',fri:'金',lat:'緯度',lng:'経度'};
function ingStatus(t){ document.getElementById('ingest-status').innerHTML=t; }
async function decodeCsv(file){
  const buf=await file.arrayBuffer();
  let text=new TextDecoder('shift_jis',{fatal:false}).decode(buf);
  if(!text || text.indexOf('企業')<0) text=new TextDecoder('utf-8').decode(buf);
  return text;
}
function isCancel(st){ return /解約|キャンセル|停止|休止|終了/.test(st||''); }
function normPlan(x){ if(!x)return''; if(x.indexOf('ごはん')>=0)return'ごはん'; if(x.indexOf('やさい')>=0)return'やさい'; return''; }
function marked(v){ v=(v==null?'':String(v)).trim(); return v!==''&&v!=='0'&&v!=='×'&&v!=='-'; }
function toNum(v){ v=(v==null?'':String(v)).trim(); if(v==='')return null; const n=Number(v); return isFinite(n)?n:null; }
function classifySets(deps,pcs){
  const dep=[...deps].filter(Boolean), pcl=[...pcs].filter(Boolean);
  const hasDel=dep.some(d=>d.indexOf('宅急便')<0&&d.indexOf('宅配')<0&&d.indexOf('メーカー')<0);
  const hasTak=dep.some(d=>d.indexOf('宅急便')>=0||d.indexOf('宅配')>=0);
  const hasFrz=dep.some(d=>d.indexOf('冷凍')>=0)||pcl.some(p=>p.indexOf('冷凍')>=0);
  if(hasDel)return'デリバリー';
  if(hasTak)return hasFrz?'宅急便(冷凍)':'宅急便';
  if(hasFrz)return'冷凍(宅配)';
  if(dep.length)return'デリバリー';
  return'未設定';
}
function transformRows(rows){
  const header=rows[0].map(h=>String(h).trim()), idx={};
  for(const k in HCOL) idx[k]=header.indexOf(HCOL[k]);
  for(const req of ['company','address','lat','lng']) if(idx[req]<0) throw new Error('必須列が見つかりません: '+HCOL[req]);
  const DAYS=[['月','mon'],['火','tue'],['水','wed'],['木','thu'],['金','fri']];
  const g=(row,k)=> idx[k]>=0 ? (row[idx[k]]==null?'':String(row[idx[k]]).trim()) : '';
  const byloc={}, stats={rawRows:rows.length-1,active:0,cancelled:0,dropped_noCoord:0};
  for(let r=1;r<rows.length;r++){
    const row=rows[r]; if(!row) continue;
    const company=g(row,'company'), address=g(row,'address');
    if(!company&&!address) continue;
    const status=g(row,'status'), cancel=isCancel(status);
    const depot=g(row,'depot'), pc=g(row,'pc'), plan=normPlan(g(row,'plan'));
    const days=DAYS.filter(d=>marked(g(row,d[1]))).map(d=>d[0]);
    let lat=toNum(g(row,'lat')), lng=toNum(g(row,'lng'));
    if(lat==null||lng==null){ stats.dropped_noCoord++; continue; }
    stats[cancel?'cancelled':'active']++;
    const key=company+'|'+g(row,'floor')+'|'+address;
    let L=byloc[key];
    if(!L){ L={name:company,floor:g(row,'floor'),addr:address,pref:g(row,'pref'),lat:Math.round(lat*1e6)/1e6,lng:Math.round(lng*1e6)/1e6,cancelled:true,status:status,act_dep:new Set(),act_pc:new Set(),any_dep:new Set(),any_pc:new Set(),plans:new Set(),days:new Set(),count:0}; byloc[key]=L; }
    if(depot)L.any_dep.add(depot); if(pc)L.any_pc.add(pc);
    if(!cancel){ L.cancelled=false; L.status=status; if(depot)L.act_dep.add(depot); if(pc)L.act_pc.add(pc); if(plan)L.plans.add(plan); days.forEach(d=>L.days.add(d)); const c=toNum(g(row,'count')); if(c!=null)L.count+=Math.round(c); }
  }
  const active=[], cx=[];
  for(const k in byloc){ const L=byloc[k];
    if(L.cancelled) cx.push({name:L.name,floor:L.floor,addr:L.addr,pref:L.pref,lat:L.lat,lng:L.lng,kubun:'解約',status:'解約',depot:'',pc:'',plans:[],days:[],count:''});
    else active.push({name:L.name,floor:L.floor,addr:L.addr,pref:L.pref,lat:L.lat,lng:L.lng,kubun:classifySets(L.act_dep,L.act_pc),status:L.status,depot:[...L.act_dep].sort().join(' / '),pc:[...L.act_pc].sort().join(' / '),plans:[...L.plans].sort(),days:['月','火','水','木','金'].filter(d=>L.days.has(d)),count:L.count});
  }
  stats.locations=active.length+cx.length; stats.active_locations=active.length; stats.cancelled_locations=cx.length;
  const now=new Date(), p2=n=>String(n).padStart(2,'0');
  const gen=`${now.getFullYear()}/${p2(now.getMonth()+1)}/${p2(now.getDate())} ${p2(now.getHours())}:${p2(now.getMinutes())}`;
  return {generatedAt:gen, active, cx, stats};
}
async function ingest(){
  const f=document.getElementById('csvfile').files[0];
  if(!f){ ingStatus('<span style="color:#f87171">CSVファイルを選んでください</span>'); return; }
  const btn=document.getElementById('ingestBtn'); btn.disabled=true;
  try{
    ingStatus('① CSV読み込み中…'); const text=await decodeCsv(f);
    ingStatus('② 解析中…'); const parsed=Papa.parse(text,{skipEmptyLines:true});
    ingStatus('③ 変換中…'); const result=transformRows(parsed.data);
    const gen=result.generatedAt;
    const post=(set,pts)=>fetch(BACKEND_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({pw:PW,set:set,json:JSON.stringify({generatedAt:gen,points:pts,stats:{locations:pts.length}})})}).then(r=>r.json());
    ingStatus(`④ 送信中… 稼働${result.stats.active_locations.toLocaleString()}拠点`);
    const d1=await post('main', result.active);
    if(!d1.ok){ ingStatus('<span style="color:#f87171">更新失敗(稼働): '+(d1.error||'')+'</span>'); return; }
    ingStatus('④ 送信中… 解約データ…');
    const d2=await post('cx', result.cx);
    if(d2.ok){ cxLoaded=false; cxCache=[]; ingStatus(`✅ 更新完了：稼働${result.stats.active_locations.toLocaleString()} ／ 解約${result.stats.cancelled_locations.toLocaleString()}拠点（座標なし${result.stats.dropped_noCoord.toLocaleString()}件は未表示）`); await loadData(); }
    else ingStatus('<span style="color:#f87171">更新失敗(解約): '+(d2.error||'')+'</span>');
  }catch(e){ ingStatus('<span style="color:#f87171">エラー: '+e.message+'</span>'); }
  finally{ btn.disabled=false; }
}
document.getElementById('ingestBtn').onclick=ingest;

document.getElementById('foot').innerHTML =
  'ピンをクリックで詳細。上部フィルタで区分・プラン・曜日・都道府県・キーワードを絞り込み。<br>「解約」はグレーピン（初期OFF）。データは社外秘。';
</script>
